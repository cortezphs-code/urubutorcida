<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#070913" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.json" />
  <title>Duelo das 4 Torcidas — Live</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Montserrat:wght@700;800;900&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #05070f;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #game-wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: calc(100vh * 9 / 16);
      max-height: 100vh;
      background: #070a14;
      overflow: hidden;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.95);
    }

    @media (max-aspect-ratio: 9/16) {
      #game-wrapper {
        max-width: 100vw;
        height: 100vh;
      }
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #top-controls {
      position: absolute;
      top: 8px;
      right: 10px;
      z-index: 30;
      display: flex;
      gap: 6px;
    }

    .ctrl-btn {
      background: rgba(12, 16, 30, 0.85);
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      border-radius: 8px;
      padding: 5px 9px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: transform 0.12s, background 0.2s;
    }

    .ctrl-btn:hover {
      background: rgba(229, 9, 20, 0.85);
      transform: scale(1.05);
    }

    #live-modal {
      position: absolute;
      inset: 0;
      background: rgba(5, 7, 15, 0.88);
      backdrop-filter: blur(10px);
      z-index: 60;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    #live-modal.open {
      display: flex;
    }

    .modal-card {
      width: 100%;
      max-width: 340px;
      background: linear-gradient(145deg, #12172a, #090d18);
      border: 2px solid rgba(255, 215, 0, 0.4);
      border-radius: 18px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8);
    }

    .modal-card h2 {
      font-family: 'Black Ops One', cursive;
      font-size: 20px;
      color: #ffd700;
      margin-bottom: 8px;
    }

    .modal-card p {
      font-size: 12px;
      color: #b5bfd4;
      margin-bottom: 14px;
      line-height: 1.4;
    }

    .modal-input {
      width: 100%;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.45);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 12px;
      outline: none;
    }

    .modal-input:focus {
      border-color: #ffd700;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
    }

    .btn-primary {
      flex: 1;
      padding: 11px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #e50914, #ff5500);
      color: #fff;
      font-weight: 900;
      font-size: 13px;
      cursor: pointer;
    }

    .btn-secondary {
      padding: 11px 14px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 10px;
      background: transparent;
      color: #ccc;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }
  </style>
</head>

  <script>
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    const W = 1080;
    const H = 1920;

    // Audio Synthesizer
    let soundEnabled = true;
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) audioCtx = new AC();
      }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type) {
      if (!soundEnabled) return;
      initAudio();
      if (!audioCtx) return;

      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'hit') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.exponentialRampToValueAtTime(75, now + 0.09);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.09);
        osc.start(now);
        osc.stop(now + 0.09);
      } else if (type === 'bomb') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(340, now);
        osc.frequency.exponentialRampToValueAtTime(45, now + 0.35);
        gain.gain.setValueAtTime(0.32, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
        osc.start(now);
        osc.stop(now + 0.35);
      } else if (type === 'win') {
        const notes = [523.25, 659.25, 783.99, 1046.5];
        notes.forEach((freq, idx) => {
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.connect(g);
          g.connect(audioCtx.destination);
          o.type = 'triangle';
          o.frequency.setValueAtTime(freq, now + idx * 0.11);
          g.gain.setValueAtTime(0.25, now + idx * 0.11);
          g.gain.linearRampToValueAtTime(0.01, now + idx * 0.11 + 0.28);
          o.start(now + idx * 0.11);
          o.stop(now + idx * 0.11 + 0.28);
        });
      }
    }

    // White Background Removal + Auto-Crop
    function extractMascotSprite(img, sx, sy, sw, sh) {
      const off = document.createElement('canvas');
      off.width = sw;
      off.height = sh;
      const octx = off.getContext('2d');
      octx.drawImage(img, sx, sy, sw, sh, 0, 0, sw, sh);

      const imgData = octx.getImageData(0, 0, sw, sh);
      const d = imgData.data;

      // Flood-fill from borders to remove only exterior white background (preserves white jerseys/eyes!)
      const visited = new Uint8Array(sw * sh);
      const queue = new Int32Array(sw * sh);
      let qHead = 0;
      let qTail = 0;

      function isBgWhite(idx) {
        const p = idx * 4;
        const r = d[p], g = d[p + 1], b = d[p + 2];
        const max = Math.max(r, g, b);
        const min = Math.min(r, g, b);
        return r > 232 && g > 232 && b > 232 && (max - min) < 22;
      }

      function enqueue(x, y) {
        if (x < 0 || x >= sw || y < 0 || y >= sh) return;
        const idx = y * sw + x;
        if (visited[idx]) return;
        if (isBgWhite(idx)) {
          visited[idx] = 1;
          queue[qTail++] = idx;
        }
      }

      for (let x = 0; x < sw; x++) {
        enqueue(x, 0);
        enqueue(x, sh - 1);
      }
      for (let y = 0; y < sh; y++) {
        enqueue(0, y);
        enqueue(sw - 1, y);
      }

      while (qHead < qTail) {
        const curr = queue[qHead++];
        const cx = curr % sw;
        const cy = (curr / sw) | 0;
        d[curr * 4 + 3] = 0;

        enqueue(cx + 1, cy);
        enqueue(cx - 1, cy);
        enqueue(cx, cy + 1);
        enqueue(cx, cy - 1);
      }

      // Soften edge pixels touching transparent background
      for (let y = 1; y < sh - 1; y++) {
        for (let x = 1; x < sw - 1; x++) {
          const idx = y * sw + x;
          if (!visited[idx]) {
            const p = idx * 4;
            if (d[p] > 220 && d[p + 1] > 220 && d[p + 2] > 220) {
              if (
                visited[idx - 1] ||
                visited[idx + 1] ||
                visited[idx - sw] ||
                visited[idx + sw]
              ) {
                d[p + 3] = 110;
              }
            }
          }
        }
      }

      octx.putImageData(imgData, 0, 0);

      // Find tight bounding box
      let minX = sw, minY = sh, maxX = 0, maxY = 0;
      for (let y = 0; y < sh; y++) {
        for (let x = 0; x < sw; x++) {
          if (d[(y * sw + x) * 4 + 3] > 20) {
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }

      if (maxX <= minX || maxY <= minY) return off;
      const cw = maxX - minX + 1;
      const ch = maxY - minY + 1;
      const cropped = document.createElement('canvas');
      cropped.width = cw;
      cropped.height = ch;
      cropped.getContext('2d').drawImage(off, minX, minY, cw, ch, 0, 0, cw, ch);
      return cropped;
    }

    function addTeamPower(teamKey, amount, nickname, customLabel) {
      if (gameState !== 'PLAYING') return;
      const team = TEAMS[teamKey];
      if (!team) return;

      // Track contributor
      if (nickname) {
        const prev = contributors.get(nickname) || { nickname, team: teamKey, points: 0 };
        prev.team = teamKey;
        prev.points += Math.round(amount * 100);
        contributors.set(nickname, prev);
      }

      // Steal share proportionally from the other 3 teams
      const boost = amount * 0.011; // e.g., 1 vote = +1.1% territory push
      const minShare = 0.04; // minimum 4% so no team disappears completely before victory
      let stolen = 0;

      TEAM_KEYS.forEach((k) => {
        if (k !== teamKey) {
          const available = Math.max(0, TEAMS[k].share - minShare);
          const take = Math.min(available, boost / 3);
          TEAMS[k].share -= take;
          stolen += take;
        }
      });
      team.share += stolen;

      // Normalize to 1.0
      const sum = TEAM_KEYS.reduce((acc, k) => acc + TEAMS[k].share, 0);
      TEAM_KEYS.forEach((k) => {
        TEAMS[k].share /= sum;
      });

      team.pulse = 1.0;

      // Spawn projectile from team quadrant center to the border intersection
      const quad = getQuadrantCenter(teamKey);
      const targetX = ARENA_X + ARENA_W * ((splitTopX + splitBotX) * 0.5);
      const targetY = ARENA_Y + ARENA_H * splitY;

      projectiles.push({
        x: quad.x,
        y: quad.y,
        tx: targetX,
        ty: targetY,
        progress: 0,
        speed: amount >= 5 ? 0.09 : 0.12,
        color: team.accent,
        size: amount >= 5 ? 26 : 15,
        teamKey,
        amount
      });

      if (amount >= 5) {
        screenShake = Math.min(22, amount * 1.4);
        playSound('bomb');
      } else {
        playSound('hit');
      }

      // Floating text
      floatingTexts.push({
        x: quad.x + (Math.random() - 0.5) * 90,
        y: quad.y - 50,
        text: customLabel || `+${team.cmd}!`,
        sub: nickname ? `@${nickname.slice(0, 14)}` : '',
        color: '#ffffff',
        stroke: team.color1,
        life: 1.0,
        scale: amount >= 5 ? 1.45 : 1.0
      });

      // Check instant domination victory (65%+)
      if (team.share >= DOMINATION_THRESHOLD) {
        triggerVictory(teamKey, 'DOMINAÇÃO TOTAL (65%+)!');
      }
    }

    function getQuadrantCenter(teamKey) {
      const sy = ARENA_Y + ARENA_H * splitY;
      const stx = ARENA_X + ARENA_W * splitTopX;
      const sbx = ARENA_X + ARENA_W * splitBotX;

      if (teamKey === 'fla') {
        return {
          x: ARENA_X + (stx - ARENA_X) * 0.5,
          y: ARENA_Y + (sy - ARENA_Y) * 0.5,
          w: stx - ARENA_X,
          h: sy - ARENA_Y
        };
      }
      if (teamKey === 'pal') {
        return {
          x: stx + (ARENA_X + ARENA_W - stx) * 0.5,
          y: ARENA_Y + (sy - ARENA_Y) * 0.5,
          w: ARENA_X + ARENA_W - stx,
          h: sy - ARENA_Y
        };
      }
      if (teamKey === 'cor') {
        return {
          x: ARENA_X + (sbx - ARENA_X) * 0.5,
          y: sy + (ARENA_Y + ARENA_H - sy) * 0.5,
          w: sbx - ARENA_X,
          h: ARENA_Y + ARENA_H - sy
        };
      }
      return {
        x: sbx + (ARENA_X + ARENA_W - sbx) * 0.5,
        y: sy + (ARENA_Y + ARENA_H - sy) * 0.5,
        w: ARENA_X + ARENA_W - sbx,
        h: ARENA_Y + ARENA_H - sy
      };
    }

    function triggerVictory(teamKey, reasonText) {
      if (gameState === 'VICTORY') return;
      gameState = 'VICTORY';
      winnerTeamKey = teamKey;
      victoryTimer = 6.5;
      TEAMS[teamKey].wins += 1;
      screenShake = 25;
      playSound('win');

      // Confetti burst
      for (let i = 0; i < 90; i++) {
        particles.push({
          x: W / 2,
          y: H / 2 - 100,
          vx: (Math.random() - 0.5) * 26,
          vy: (Math.random() - 0.7) * 26,
          size: 8 + Math.random() * 10,
          color: i % 2 === 0 ? TEAMS[teamKey].color1 : '#ffd700',
          life: 1.0,
          decay: 0.012 + Math.random() * 0.01
        });
      }

      addTicker(`🏆 ${TEAMS[teamKey].name} VENCEU A RODADA! (${reasonText})`, '#ffd700');
    }

    function resetRound() {

    function addTicker(text, color = '#ffffff') {

    // Parse chat comments client-side too
    function detectTeamClient(raw) {
      const clean = String(raw || '')
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .trim();
      if (!clean) return null;
      if (clean.includes('urubu') || clean.includes('flamengo') || clean.includes('mengao') || clean.includes('mengo') || /\bfla\b/.test(clean) || clean === '1') return 'fla';
      if (clean.includes('porco') || clean.includes('palmeiras') || clean.includes('verdao') || /\bpal\b/.test(clean) || clean === '2') return 'pal';
      if (clean.includes('gaviao') || clean.includes('corinthians') || clean.includes('timao') || clean.includes('fiel') || /\bcor\b/.test(clean) || clean === '3') return 'cor';
      if (clean.includes('vasco') || clean.includes('almirante') || clean.includes('gigante') || clean.includes('vascao') || /\bvas\b/.test(clean) || clean === '4') return 'vas';
      return null;
    }

    // Connect WebSocket (igual ao urubu-corrida-live) + fallback SSE

    function connectLiveBackend() {
      if (location.protocol === 'file:') {
        setModalStatus(
          '⚠️ Você abriu o arquivo index.html direto da pasta (file://). Para ler o chat do TikTok, rode "npm start" no terminal (http://localhost:3000) ou abra pelo link do Render!',
          '#ff4d4d'
        );
        return;
      }

      try {
        const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
        ws = new WebSocket(`${proto}//${location.host}`);

        ws.onopen = () => {
          wsConnected = true;
          setModalStatus('✅ Servidor conectado! Digite seu @usuario acima e clique em Conectar Live.', '#00ff88');
          // Auto-connect if ?user= in URL or saved in localStorage
          const urlUser = new URLSearchParams(location.search).get('user');
          const savedUser = localStorage.getItem('tiktok_live_user') || '';
          const autoUser = (urlUser || savedUser).replace(/^@/, '').trim();
          if (autoUser) {
            document.getElementById('tiktok-user-input').value = autoUser;
            if (urlUser) {
              ws.send(JSON.stringify({ type: 'connect_tiktok', username: autoUser }));
            }
          }
        };

        ws.onmessage = (evt) => {
          try {
            const data = JSON.parse(evt.data);
            handleServerEvent(data);
          } catch (_) {}
        };

        ws.onclose = () => {
          wsConnected = false;
          setTimeout(connectLiveBackend, 3000);
        };
      } catch (_) {}
    }
    connectLiveBackend();

    function handleServerEvent(data) {
      if (data.type === 'status') {
        liveConnected = !!data.connected;
        if (data.username) liveUsername = data.username;
        if (typeof data.viewerCount === 'number') {
          liveViewerCount = data.viewerCount;
        }
        if (data.message || data.error) {
          setModalStatus(data.error || data.message, liveConnected ? '#00ff88' : '#ffd700');
        }
        if (liveConnected) {
          botsEnabled = false;
          document.getElementById('btn-bots').textContent = '🤖 BOTS: OFF';
          addTicker(`🟢 Conectado à Live de @${liveUsername}!`, '#00ff88');
          setTimeout(() => {
            document.getElementById('live-modal').classList.remove('open');
          }, 800);
        }
        return;
      }

      if (data.type === 'roomUser' || data.type === 'viewers') {
        if (typeof data.viewerCount === 'number') {
          liveViewerCount = data.viewerCount;
        }
        return;
      }

      if (data.type === 'chat') {
        const sender = data.nickname || data.user || 'Torcedor';
        const uid = data.userId || sender;
        const teamKey = data.team || detectTeamClient(data.comment);
        if (teamKey && TEAMS[teamKey]) {
          userLastTeam.set(uid, teamKey);
          addTeamPower(teamKey, 1.3, sender, `+1 ${TEAMS[teamKey].cmd}`);
          addTicker(`💬 @${sender}: ${data.comment}`, TEAMS[teamKey].accent);
        } else if (data.comment) {
          addTicker(`💬 @${sender}: ${data.comment}`, '#b5bfd4');
        }
        return;
      }

      if (data.type === 'like') {
        const sender = data.nickname || data.user || 'Torcedor';
        const uid = data.userId || sender;
        const teamKey = userLastTeam.get(uid);
        if (teamKey && TEAMS[teamKey]) {
          addTeamPower(teamKey, 0.35, sender, `❤️ LIKE`);

        return;

      if (data.type === 'gift') {

        addTicker(`🎁 @${sender} enviou ${data.giftName} para ${TEAMS[teamKey].name}!`, '#ffd700');

    // Main Update & Draw Loop
    let lastTime = performance.now();

    function update(dt) {
      if (screenShake > 0) {
        screenShake = Math.max(0, screenShake - dt * 40);
      }

      if (gameState === 'PLAYING') {
        roundTimer -= dt;
        if (roundTimer <= 0) {
          roundTimer = 0;
          // Winner is team with highest share
          let bestKey = 'fla';
          TEAM_KEYS.forEach((k) => {
            if (TEAMS[k].share > TEAMS[bestKey].share) bestKey = k;
          });
          triggerVictory(bestKey, 'TEMPO ESGOTADO — MAIOR TERRITÓRIO!');
        }
      } else if (gameState === 'VICTORY') {
        victoryTimer -= dt;
        if (victoryTimer <= 0) {
          resetRound();
        }
      }

      // Smoothly interpolate shares and border splits
      TEAM_KEYS.forEach((k) => {
        TEAMS[k].displayShare += (TEAMS[k].share - TEAMS[k].displayShare) * Math.min(1, dt * 8);
        if (TEAMS[k].pulse > 0) {
          TEAMS[k].pulse = Math.max(0, TEAMS[k].pulse - dt * 3.2);
        }
      });

      const topTarget = Math.max(0.12, Math.min(0.88, TEAMS.fla.displayShare + TEAMS.pal.displayShare));
      const botTarget = Math.max(0.12, 1 - topTarget);
      const topXTarget = Math.max(0.12, Math.min(0.88, TEAMS.fla.displayShare / topTarget));
      const botXTarget = Math.max(0.12, Math.min(0.88, TEAMS.cor.displayShare / botTarget));

      splitY += (topTarget - splitY) * Math.min(1, dt * 9);
      splitTopX += (topXTarget - splitTopX) * Math.min(1, dt * 9);
      splitBotX += (botXTarget - splitBotX) * Math.min(1, dt * 9);

      // Update projectiles
      for (let i = projectiles.length - 1; i >= 0; i--) {
        const p = projectiles[i];
        p.progress += p.speed;
        if (p.progress >= 1) {
          // Spawn impact sparks at border intersection
          for (let s = 0; s < 10; s++) {
            particles.push({
              x: p.tx,
              y: p.ty,
              vx: (Math.random() - 0.5) * 16,
              vy: (Math.random() - 0.5) * 16,
              size: 5 + Math.random() * 6,
              color: p.color,
              life: 1.0,
              decay: 0.04 + Math.random() * 0.03
            });
          }
          projectiles.splice(i, 1);
        }
      }

      // Update particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.life -= pt.decay;
        if (pt.life <= 0) particles.splice(i, 1);
      }

      // Update floating texts
      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.y -= dt * 75;
        ft.life -= dt * 1.15;
        if (ft.life <= 0) floatingTexts.splice(i, 1);
      }
    }

    function drawRoundedRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function drawQuadrant(teamKey, x, y, w, h, time) {
      const team = TEAMS[teamKey];
      ctx.save();
      ctx.beginPath();
      ctx.rect(x, y, w, h);
      ctx.clip();

      // Background turf gradient
      const cx = x + w * 0.5;
      const cy = y + h * 0.5;
      const rad = Math.max(w, h) * 0.85;
      const grad = ctx.createRadialGradient(cx, cy, 10, cx, cy, rad);
      grad.addColorStop(0, team.color1);
      grad.addColorStop(1, team.color2);
      ctx.fillStyle = grad;
      ctx.fillRect(x, y, w, h);

      // Team-specific pattern stripes for instant visual identity
      ctx.save();
      ctx.globalAlpha = 0.14;
      if (teamKey === 'fla') {
        // Horizontal rubro-negro stripes
        ctx.fillStyle = '#000000';
        for (let sy = y; sy < y + h; sy += 48) {
          ctx.fillRect(x, sy, w, 24);
        }
      } else if (teamKey === 'pal') {
        // Diagonal emerald lines
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 10;
        for (let sx = -h; sx < w + h; sx += 52) {
          ctx.beginPath();
          ctx.moveTo(x + sx, y);
          ctx.lineTo(x + sx + h, y + h);
          ctx.stroke();
        }
      } else if (teamKey === 'cor') {
        // Vertical white pinstripes
        ctx.fillStyle = '#ffffff';
        for (let sx = x; sx < x + w; sx += 44) {
          ctx.fillRect(sx, y, 6, h);
        }
      } else if (teamKey === 'vas') {
        // Bold diagonal white sash
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 70;
        ctx.beginPath();
        ctx.moveTo(x, y + h);
        ctx.lineTo(x + w, y);
        ctx.stroke();
      }
      ctx.restore();

      // Danger pulsing overlay when territory < 12%
      const pct = Math.round(team.displayShare * 100);
      const inDanger = pct <= 12;
      if (inDanger) {
        const flash = 0.25 + 0.25 * Math.sin(time * 0.015);
        ctx.fillStyle = `rgba(255, 0, 50, ${flash})`;
        ctx.fillRect(x, y, w, h);
      }

      // Draw 3D Mascot Sprite scaled to fit quadrant
      const spr = sprites[teamKey];
      const minDim = Math.min(w, h);
      const bounce = Math.sin(time * 0.006 + (teamKey === 'fla' ? 0 : teamKey === 'pal' ? 1.5 : teamKey === 'cor' ? 3 : 4.5)) * 6;
      const pulseScale = 1 + team.pulse * 0.16;

      if (spr && minDim > 70) {
        const maxSpriteH = Math.min(h * 0.56, w * 0.72, 370);
        const aspect = spr.width / spr.height;
        const drawH = maxSpriteH * pulseScale;
        const drawW = drawH * aspect;

        // Glow behind mascot
        const glowGrad = ctx.createRadialGradient(cx, cy - 10, 10, cx, cy - 10, drawH * 0.55);
        glowGrad.addColorStop(0, 'rgba(255,255,255,0.38)');
        glowGrad.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = glowGrad;
        ctx.beginPath();
        ctx.arc(cx, cy - 10, drawH * 0.55, 0, Math.PI * 2);
        ctx.fill();

        ctx.drawImage(
          spr,
          cx - drawW * 0.5,
          cy - drawH * 0.54 + bounce,
          drawW,
          drawH
        );
      }

      // Percentage Giant Badge (Top Corner of Quadrant)
      const isLeft = teamKey === 'fla' || teamKey === 'cor';
      const isTop = teamKey === 'fla' || teamKey === 'pal';
      const badgeX = isLeft ? x + 16 : x + w - 156;
      const badgeY = isTop ? y + 16 : y + 16;

      ctx.fillStyle = 'rgba(5, 8, 18, 0.78)';
      drawRoundedRect(badgeX, badgeY, 140, 62, 14);
      ctx.fill();
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = team.accent;
      ctx.stroke();

      ctx.font = '900 34px "Black Ops One", sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.fillText(`${pct}%`, badgeX + 70, badgeY + 44);

      // Wins Trophy count badge
      if (team.wins > 0 && w > 220) {
        const winX = isLeft ? badgeX + 148 : badgeX - 96;
        ctx.fillStyle = 'rgba(255, 215, 0, 0.2)';
        drawRoundedRect(winX, badgeY + 8, 88, 44, 12);
        ctx.fill();
        ctx.strokeStyle = '#ffd700';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.font = '900 22px "Montserrat", sans-serif';
        ctx.fillStyle = '#ffd700';
        ctx.fillText(`🏆 ${team.wins}`, winX + 44, badgeY + 38);
      }

      // Call-To-Action Pill at bottom of Quadrant: "DIGITE: URUBU"
      const pillW = Math.min(w - 20, 320);
      const pillH = 66;
      const pillX = cx - pillW * 0.5;
      const pillY = y + h - pillH - 16;

      if (pillW > 110 && h > 140) {
        ctx.fillStyle = 'rgba(6, 9, 18, 0.88)';
        drawRoundedRect(pillX, pillY, pillW, pillH, 16);
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = inDanger ? '#ff0044' : team.accent;
        ctx.stroke();

        ctx.font = `900 ${Math.min(20, pillW * 0.07)}px "Montserrat", sans-serif`;
        ctx.fillStyle = '#ffd700';
        ctx.textAlign = 'center';
        ctx.fillText(
          inDanger ? `⚠️ SALVE O ${team.name}!` : `${team.name}`,
          cx,
          pillY + 24
        );

        ctx.font = `900 ${Math.min(26, pillW * 0.088)}px "Black Ops One", sans-serif`;
        ctx.fillStyle = '#ffffff';
        ctx.fillText(`DIGITE: ${team.cmd}`, cx, pillY + 54);
      }

      ctx.restore();
    }

    function draw(time) {
      const dt = Math.min(0.05, (time - lastTime) / 1000);
      lastTime = time;
      update(dt);

      ctx.save();
      if (screenShake > 0) {
        const sx = (Math.random() - 0.5) * screenShake;
        const sy = (Math.random() - 0.5) * screenShake;
        ctx.translate(sx, sy);
      }

      // Background
      ctx.fillStyle = '#060812';
      ctx.fillRect(0, 0, W, H);

      // ================= HEADER =================
      // Live Status + Dynamic Viewer Count Pill
      ctx.fillStyle = 'rgba(16, 22, 40, 0.92)';
      drawRoundedRect(28, 22, 430, 50, 25);
      ctx.fill();
      ctx.strokeStyle = liveConnected ? '#00ff88' : 'rgba(255,255,255,0.2)';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Blinking Live Dot
      ctx.beginPath();
      ctx.arc(56, 47, 9, 0, Math.PI * 2);
      ctx.fillStyle = liveConnected ? '#00ff66' : '#ff3b3b';
      ctx.fill();

      ctx.font = '800 20px "Montserrat", sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'left';
      const statusLabel = liveConnected
        ? `AO VIVO @${liveUsername.slice(0, 12)} • 👁️ ${liveViewerCount}`
        : `MODO DEMO • 👁️ ${liveViewerCount} na live`;
      ctx.fillText(statusLabel, 76, 54);

      // Main Title Banner
      ctx.textAlign = 'center';
      ctx.font = '900 44px "Black Ops One", sans-serif';
      ctx.fillStyle = '#ffd700';
      ctx.shadowColor = 'rgba(255, 180, 0, 0.55)';
      ctx.shadowBlur = 16;
      ctx.fillText('GUERRA DAS 4 TORCIDAS', W / 2, 128);
      ctx.shadowBlur = 0;

      ctx.font = '800 22px "Montserrat", sans-serif';
      ctx.fillStyle = '#dbe4ff';
      ctx.fillText('QUEM DOMINAR 65% DO MAPA OU VENCER NO TEMPO É CAMPEÃO!', W / 2, 162);

      // 4-Team Overall Dominance Bar + Round Timer
      const barX = 28;
      const barY = 182;
      const barW = W - 56;
      const barH = 44;

      ctx.save();
      drawRoundedRect(barX, barY, barW, barH, 14);
      ctx.clip();

      let curX = barX;
      TEAM_KEYS.forEach((k) => {
        const segW = barW * TEAMS[k].displayShare;
        ctx.fillStyle = TEAMS[k].color1;
        ctx.fillRect(curX, barY, segW + 1, barH);
        if (segW > 95) {
          ctx.font = '900 20px "Montserrat", sans-serif';
          ctx.fillStyle = '#ffffff';
          ctx.textAlign = 'center';
          ctx.fillText(`${TEAMS[k].cmd} ${Math.round(TEAMS[k].displayShare * 100)}%`, curX + segW * 0.5, barY + 29);
        }
        curX += segW;
      });
      ctx.restore();

      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2.5;
      drawRoundedRect(barX, barY, barW, barH, 14);
      ctx.stroke();

      // ================= ARENA (4 QUADRANTS) =================
      ctx.save();
      drawRoundedRect(ARENA_X, ARENA_Y, ARENA_W, ARENA_H, 26);
      ctx.clip();

      const sy = ARENA_Y + ARENA_H * splitY;
      const stx = ARENA_X + ARENA_W * splitTopX;
      const sbx = ARENA_X + ARENA_W * splitBotX;

      // Top-Left: Flamengo
      drawQuadrant('fla', ARENA_X, ARENA_Y, stx - ARENA_X, sy - ARENA_Y, time);
      // Top-Right: Palmeiras
      drawQuadrant('pal', stx, ARENA_Y, ARENA_X + ARENA_W - stx, sy - ARENA_Y, time);
      // Bottom-Left: Corinthians
      drawQuadrant('cor', ARENA_X, sy, sbx - ARENA_X, ARENA_Y + ARENA_H - sy, time);
      // Bottom-Right: Vasco
      drawQuadrant('vas', sbx, sy, ARENA_X + ARENA_W - sbx, ARENA_Y + ARENA_H - sy, time);

      // Glowing Energy Borders
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 7;
      ctx.shadowColor = '#00e5ff';
      ctx.shadowBlur = 18;

      // Horizontal split line
      ctx.beginPath();
      ctx.moveTo(ARENA_X, sy);
      ctx.lineTo(ARENA_X + ARENA_W, sy);
      ctx.stroke();

      // Top vertical split line
      ctx.beginPath();
      ctx.moveTo(stx, ARENA_Y);
      ctx.lineTo(stx, sy);
      ctx.stroke();

      // Bottom vertical split line
      ctx.beginPath();
      ctx.moveTo(sbx, sy);
      ctx.lineTo(sbx, ARENA_Y + ARENA_H);
      ctx.stroke();
      ctx.shadowBlur = 0;

      // Central Timer Badge on the horizontal border
      const timerCX = (stx + sbx) * 0.5;
      const timerCY = sy;
      ctx.fillStyle = '#080b16';
      ctx.beginPath();
      ctx.arc(timerCX, timerCY, 54, 0, Math.PI * 2);
      ctx.fill();
      ctx.lineWidth = 5;
      ctx.strokeStyle = roundTimer <= 15 ? '#ff2a4b' : '#ffd700';
      ctx.stroke();

      const mins = Math.floor(roundTimer / 60);
      const secs = Math.floor(roundTimer % 60);
      const timeStr = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
      ctx.font = '900 30px "Black Ops One", sans-serif';
      ctx.fillStyle = roundTimer <= 15 ? '#ff4d4d' : '#ffd700';
      ctx.textAlign = 'center';
      ctx.fillText(timeStr, timerCX, timerCY + 11);

      // Projectiles
      projectiles.forEach((p) => {
        const px = p.x + (p.tx - p.x) * p.progress;
        const py = p.y + (p.ty - p.y) * p.progress;
        ctx.save();
        ctx.beginPath();
        ctx.arc(px, py, p.size, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 20;
        ctx.fill();
        ctx.restore();
      });

      // Particles
      particles.forEach((pt) => {
        ctx.save();
        ctx.globalAlpha = Math.max(0, pt.life);
        ctx.fillStyle = pt.color;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // Floating Texts
      floatingTexts.forEach((ft) => {
        ctx.save();
        ctx.globalAlpha = Math.max(0, ft.life);
        ctx.translate(ft.x, ft.y);
        ctx.scale(ft.scale, ft.scale);
        ctx.font = '900 28px "Black Ops One", sans-serif';
        ctx.textAlign = 'center';
        ctx.lineWidth = 6;
        ctx.strokeStyle = ft.stroke;
        ctx.strokeText(ft.text, 0, 0);
        ctx.fillStyle = ft.color;
        ctx.fillText(ft.text, 0, 0);
        if (ft.sub) {
          ctx.font = '800 18px "Montserrat", sans-serif';
          ctx.fillStyle = '#ffd700';
          ctx.fillText(ft.sub, 0, 22);
        }
        ctx.restore();
      });

      ctx.restore(); // End Arena Clip

      // Arena Outer Border
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
      ctx.lineWidth = 4;
      drawRoundedRect(ARENA_X, ARENA_Y, ARENA_W, ARENA_H, 26);
      ctx.stroke();

      // ================= BOTTOM HUD: COMMANDS & LIVE FEED =================
      const footY = ARENA_Y + ARENA_H + 18;

      // Gift / Boost Banner
      ctx.fillStyle = 'rgba(15, 20, 38, 0.95)';
      drawRoundedRect(28, footY, W - 56, 175, 22);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255, 215, 0, 0.45)';
      ctx.lineWidth = 2.5;
      ctx.stroke();

      ctx.font = '900 25px "Black Ops One", sans-serif';
      ctx.fillStyle = '#ffd700';
      ctx.textAlign = 'center';
      ctx.fillText('💬 COMENTE NO CHAT PARA INVADIR O TERRITÓRIO RIVAL!', W / 2, footY + 38);

      // 4 Command Pills Row
      const pillGap = 14;
      const cmdW = (W - 96 - pillGap * 3) / 4;
      TEAM_KEYS.forEach((k, idx) => {
        const t = TEAMS[k];
        const px = 48 + idx * (cmdW + pillGap);
        const py = footY + 52;
        ctx.fillStyle = t.badgeBg;
        drawRoundedRect(px, py, cmdW, 60, 14);
        ctx.fill();
        ctx.strokeStyle = t.accent;
        ctx.lineWidth = 2.5;
        ctx.stroke();

        ctx.font = '900 22px "Black Ops One", sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';
        ctx.fillText(t.cmd, px + cmdW * 0.5, py + 30);

        ctx.font = '800 14px "Montserrat", sans-serif';
        ctx.fillStyle = '#ffd700';
        ctx.fillText(`🏆 ${t.wins} TÍTULOS`, px + cmdW * 0.5, py + 50);
      });

      ctx.font = '800 20px "Montserrat", sans-serif';
      ctx.fillStyle = '#00ffaa';
      ctx.textAlign = 'center';
      ctx.fillText('🌹 ROSA = ATAQUE PESADO (+5%)   |   ⚡ GIFT 10+ = BOMBA (+14%)   |   💣 GIFT 100+ = DEVASTAÇÃO (+35%)', W / 2, footY + 148);

      // Recent Live Chat / Action Ticker
      const tickerY = footY + 190;
      ctx.fillStyle = 'rgba(9, 13, 24, 0.9)';
      drawRoundedRect(28, tickerY, W - 56, 210, 20);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.font = '900 20px "Montserrat", sans-serif';
      ctx.fillStyle = '#8fa2c9';
      ctx.textAlign = 'left';
      ctx.fillText('⚡ ÚLTIMAS AÇÕES DA TORCIDA NA LIVE:', 52, tickerY + 34);

      recentTicker.slice(0, 4).forEach((item, i) => {
        ctx.font = '800 22px "Montserrat", sans-serif';
        ctx.fillStyle = item.color || '#ffffff';
        ctx.fillText(item.text.slice(0, 54), 52, tickerY + 74 + i * 38);
      });

      // ================= VICTORY OVERLAY =================
      if (gameState === 'VICTORY' && winnerTeamKey) {
        const winTeam = TEAMS[winnerTeamKey];
        ctx.fillStyle = 'rgba(4, 6, 14, 0.88)';
        ctx.fillRect(0, 0, W, H);

        // Card
        const cardW = 920;
        const cardH = 1080;
        const cardX = (W - cardW) / 2;
        const cardY = (H - cardH) / 2 - 40;

        const cGrad = ctx.createLinearGradient(cardX, cardY, cardX, cardY + cardH);
        cGrad.addColorStop(0, winTeam.color1);
        cGrad.addColorStop(1, '#090d1a');
        ctx.fillStyle = cGrad;
        drawRoundedRect(cardX, cardY, cardW, cardH, 36);
        ctx.fill();
        ctx.lineWidth = 6;
        ctx.strokeStyle = '#ffd700';
        ctx.stroke();

        ctx.textAlign = 'center';
        ctx.font = '900 58px "Black Ops One", sans-serif';
        ctx.fillStyle = '#ffd700';
        ctx.fillText('🏆 TORCIDA CAMPEÃ! 🏆', W / 2, cardY + 95);

        ctx.font = '900 72px "Black Ops One", sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.fillText(winTeam.name, W / 2, cardY + 180);

        // Draw Winner Mascot
        const winSpr = sprites[winnerTeamKey];
        if (winSpr) {
          const sh = 420;
          const sw = sh * (winSpr.width / winSpr.height);
          ctx.drawImage(winSpr, W / 2 - sw / 2, cardY + 210, sw, sh);
        }

        // Top 3 MVP Contributors for Winner Team
        ctx.font = '900 32px "Black Ops One", sans-serif';
        ctx.fillStyle = '#ffd700';
        ctx.fillText('🌟 TOP MVPs DA RODADA:', W / 2, cardY + 690);

        const topList = Array.from(contributors.values())
          .filter((c) => c.team === winnerTeamKey)
          .sort((a, b) => b.points - a.points)
          .slice(0, 3);

        if (topList.length === 0) {
          ctx.font = '800 26px "Montserrat", sans-serif';
          ctx.fillStyle = '#ffffff';
          ctx.fillText('Torcida Unida na Live!', W / 2, cardY + 755);
        } else {
          topList.forEach((mvp, idx) => {
            const medals = ['🥇', '🥈', '🥉'];
            ctx.font = '800 28px "Montserrat", sans-serif';
            ctx.fillStyle = '#ffffff';
            ctx.fillText(`${medals[idx]} @${mvp.nickname} — ${mvp.points} pts`, W / 2, cardY + 750 + idx * 48);
          });
        }

        ctx.font = '900 30px "Montserrat", sans-serif';
        ctx.fillStyle = '#00ffaa';
        ctx.fillText(`Próxima batalha em ${Math.ceil(victoryTimer)}s...`, W / 2, cardY + 995);
      }

      ctx.restore();
      requestAnimationFrame(draw);
    }

    requestAnimationFrame(draw);
  </script>
</body>
</html>
